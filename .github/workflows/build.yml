name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'testing/**'
      - 'work/**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize numeric test-version verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text()
          old = "if (mod_version != '0.2.0-alpha') throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          new = "if (!(mod_version ==~ /[0-9]+\\.[0-9]+/)) throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          if old not in text:
              raise SystemExit('Expected legacy version verifier was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload test JAR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: matteroverdrive-test-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish work-branch test JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found" >&2
            exit 1
          fi
          OUT="MatterOverdrive-1.20.1-0.3-pointblank-test.jar"
          cp "$JAR" "$OUT"
          TAG="0.3-pointblank-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
            gh release edit "$TAG" --notes "Matter Overdrive 0.3 Point Blank/Destiny integration test build. Built from ${GITHUB_SHA}."
          else
            gh release create "$TAG" "$OUT" --prerelease --target "$GITHUB_SHA" --title "Matter Overdrive 0.3 Point Blank Test" --notes "Matter Overdrive 0.3 Point Blank/Destiny integration test build. Built from ${GITHUB_SHA}."
          fi
