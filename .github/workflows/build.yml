name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'testing/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize numeric test-version verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text()
          old = "if (mod_version != '0.2.0-alpha') throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          new = "if (!(mod_version ==~ /[0-9]+\\.[0-9]+/)) throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          if old not in text:
              raise SystemExit('Expected legacy version verifier was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: matteroverdrive-test-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
