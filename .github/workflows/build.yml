name: Build

on:
  push:
    branches:
      - main
      - feature/fusion-reactor
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
