name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'testing/**'
      - 'work/**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize numeric test-version verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text()
          old = "if (mod_version != '0.2.0-alpha') throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          new = "if (!(mod_version ==~ /[0-9]+\\.[0-9]+/)) throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          if old in text:
              path.write_text(text.replace(old, new, 1))
              print('Updated legacy version verifier')
          elif new in text:
              print('Numeric version verifier already present')
          else:
              print('No legacy version verifier present; no normalization required')
          PY

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload test JAR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: matteroverdrive-test-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish work-branch test JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found" >&2
            exit 1
          fi
          OUT="MatterOverdrive-1.20.1-0.3-pointblank-test.jar"
          cp "$JAR" "$OUT"
          TAG="0.3-pointblank-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
            gh release edit "$TAG" --notes "Matter Overdrive 0.3 native Destiny integration test build. Built from ${GITHUB_SHA}."
          else
            gh release create "$TAG" "$OUT" --prerelease --target "$GITHUB_SHA" --title "Matter Overdrive 0.3 Native Destiny Test" --notes "Matter Overdrive 0.3 native Destiny integration test build. Built from ${GITHUB_SHA}."
          fi

      - name: Emit signed test JAR URL
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="0.3-pointblank-test"
          NAME="MatterOverdrive-1.20.1-0.3-pointblank-test.jar"
          ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${NAME}\") | .id")
          curl -sS --max-redirs 0 -D /tmp/asset_headers -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          SIGNED_URL=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); sub(/\r$/,""); print; exit}' /tmp/asset_headers)
          echo "SIGNED_ASSET_URL=${SIGNED_URL}"
