name: Verify JEI Staging

on:
  push:
    branches:
      - jei-integration-staging
    paths:
      - '.github/workflows/verify-jei-staging.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jei-integration-staging
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile with JEI API
        run: |
          chmod +x gradlew
          ./gradlew compileJava --stacktrace
