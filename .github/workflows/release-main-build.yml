name: Release Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-main-build.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: matteroverdrive-main-release
  cancel-in-progress: true

env:
  VERSION: '0.7'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify release version
        run: |
          grep -q '^mod_version=0.7$' gradle.properties

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          cp "$JAR" "MatterOverdrive-1.20.1-${VERSION}.jar"
          echo "RELEASE_JAR=MatterOverdrive-1.20.1-${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          # Matter Overdrive 1.20.1 ${VERSION}

          Release 0.7 consolidates the 0.6 campaign/world-content line with the complete tech overhaul, dual-resource Energy Bank, expanded world population, deterministic relic loot, Frontier Expedition sites, PDA/GuideME audit coverage and native Destiny GunPack weapon set.

          ## Complete 0.7 feature set

          - Added Energy Bank dual FE/Matter storage fed by reactor IO and exposed to compatible FE/Matter networks without resource conversion, duplication or feedback loops.
          - Added Quantum Flux Reactor, Environmental Regulator, Wall Terminal, reactor/decorative blocks, hybrid FE+Matter conduit routing and the associated machine telemetry.
          - Added Deep Matter Vault, Autonomous Drone Foundry, Anomaly Quarantine Site and Orbital Recovery Array Frontier Expedition sites.
          - Added natural hostile spawning for Rogue Androids, Ranged Rogue Androids, Drones, Mutant Scientists, Assimilators and Phase Stalkers, plus village Field Scientists, Systems Engineers and Mad Scientists.
          - Added vanilla structure loot injection that preserves vanilla pools, Matter Overdrive supplies and seven deterministic Legendary Relic sources.
          - Added themed Legendary Relic pools to the six main technology-facility caches using the existing recovered artifact and passive-protocol progression.
          - Added 35 native Destiny GunPack conversions, bringing the registered native Destiny set to 49 energy weapons.
          - Imported per-weapon Destiny geometry, textures, source audio, available animations and display transforms, with native animation aliases and static-idle fallbacks.
          - Connected Destiny weapons to existing Energy Weapon, Weapon System, battery/barrel/sights/colour/utility module and Weapon Station behavior.
          - Added source-transform first-person rendering, bounded ADS/recoil presentation and third-person generic-use pose suppression.
          - Added GuideME block-reference descriptions, item image links, live recipe links and cross-checked source/resource validators.

          ## Matter economy

          - Added recursive recipe-derived matter values for craftable items.
          - Crafted outputs inherit the subtotal of their component values with recipe output counts accounted for.
          - Explicit legacy/material values remain authoritative and tag-based material seeds remain supported.
          - Added conservative fallback valuation for obtainable items that have no resolvable normal recipe.
          - Matter Analyzer and Decomposer now use the same level-aware resolver so newly analysed patterns and decomposition yields agree.
          - Added recipe-cache invalidation using recipe count and recipe-ID fingerprinting.

          ## Player-facing matter information

          - Matter values are shown in item tooltips.
          - Holding Shift shows whether a value is dynamic, explicit, tag-based, recipe-derived or fallback.
          - Added startup matter-registry coverage auditing.

          ## New 0.6 diagnostics feature set

          - Added `/matteroverdrive matter value` to inspect the held item's resolved value and source.
          - Added operator `/matteroverdrive matter audit` to report registry coverage by value source.
          - Added operator `/matteroverdrive matter clearcache` for recipe/datapack economy testing.
          - Added `docs/reference/MATTER_VALUE_COVERAGE.md` with resolver rules, safeguards and runtime tests.

          ## Consolidated forward work

          - Includes the current scientist/research campaign progression from the 0.5 line.
          - Includes the forward survival/world-structure feasibility branch.
          - Preserves the current Android, reactor, anomaly, networking, weapons, machine GUI, quest and world-content work on main.

          ## Testing focus

          - Verify raw explicit values and tag values.
          - Verify simple and recursive recipe subtotals, alternative ingredients and multi-output recipes.
          - Verify Analyzer -> Pattern Storage -> Replicator agrees with Decomposer yield.
          - Check fallback-valued items from the startup audit for balance candidates.
          - Re-test reactor, Android, weapons, campaign and structure generation after the branch consolidation.

          Built from commit $GITHUB_SHA.
          EOF

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RELEASE_JAR" --clobber
            gh release edit "$VERSION" --target "$GITHUB_SHA" --title "Matter Overdrive 1.20.1 ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$VERSION" "$RELEASE_JAR" --target "$GITHUB_SHA" --title "Matter Overdrive 1.20.1 ${VERSION}" --notes-file release-notes.md
          fi
