name: Release Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-main-build.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: matteroverdrive-main-release
  cancel-in-progress: true

env:
  VERSION: '0.5'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize numeric test-version verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text()
          old = "if (mod_version != '0.2.0-alpha') throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          new = "if (!(mod_version ==~ /[0-9]+\\.[0-9]+/)) throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          if old not in text:
              raise SystemExit('Expected legacy version verifier was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          cp "$JAR" "MatterOverdrive-1.20.1-${VERSION}.jar"
          echo "RELEASE_JAR=MatterOverdrive-1.20.1-${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          # Matter Overdrive 1.20.1 ${VERSION}

          Release 0.5 is the research-campaign update. It turns the restored systems in the port into one connected progression rather than leaving them as isolated machines.

          ## Scientist campaign

          - Added a paginated NPC dialogue UI with wrapped dialogue, Back, Continue, Close and page indicators.
          - Restored Crash Landing, We Must Know, G.M.O., Trade Route, Self-Sealing Stem Bolts and To the Power Of as a sequential scientist campaign.
          - Added Dr. Voss, Dr. Sato, Dr. Kessler and Dr. Hale research identities and persistent research clearance.
          - Added migration handling for existing Android characters and older quest-contract inventories.

          ## New canonical progression

          Scientist Research → Matter Technology → Automation & Drones → Advanced Power → Fusion Research → Anomaly Engineering

          Android class progression remains a parallel build system. Star Map content remains registered for save compatibility but is not part of this progression spine.

          ## 18 new research assignments

          ### Matter Technology
          - The Value of Everything
          - Break It Down
          - Matter Reserve
          - Pattern Recognition
          - Make Something From Nothing

          ### Automation & Drones
          - Network Backbone
          - Matter Logistics
          - Instant Freight

          ### Advanced Power
          - A Stable Baseline
          - Stored Potential
          - Heavy Distribution

          ### Fusion Research
          - Containment First
          - Build the Impossible
          - Feed and Draw
          - Sustained Experiment

          ### Anomaly Engineering
          - Across the Horizon
          - Spacetime Control
          - Anomaly Engineering

          ## Research journal and quest quality of life

          - The Data Pad now displays the current research stage, active assignment and complete six-stage research roadmap alongside scan history.
          - Multi-part quests expose Stage X/Y.
          - Scientist redemption cleans up stale duplicate research contracts and advances persistent campaign state.
          - Quest rewards now deliberately feed the next system being taught, including matter storage, pattern, networking, power, reactor and spacetime equipment.
          - Cocktail of Ascension remains available as a special project after the main campaign.

          ## Testing note

          The earlier dialogue/legacy-quest foundation passed CI. At the time this release branch was prepared, later GitHub Actions jobs were terminating before checkout with zero runner steps, so those failed runs did not produce a Gradle compile result. Runtime testing of the full 18-assignment campaign is still recommended.

          Built from commit $GITHUB_SHA.
          EOF

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RELEASE_JAR" --clobber
            gh release edit "$VERSION" --target "$GITHUB_SHA" --title "Matter Overdrive 1.20.1 ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$VERSION" "$RELEASE_JAR" --target "$GITHUB_SHA" --title "Matter Overdrive 1.20.1 ${VERSION}" --notes-file release-notes.md
          fi
