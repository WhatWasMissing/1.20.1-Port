name: Release Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-main-build.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: matteroverdrive-main-release
  cancel-in-progress: true

env:
  VERSION: '0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          cp "$JAR" "MatterOverdrive-1.20.1-${VERSION}.jar"
          echo "RELEASE_JAR=MatterOverdrive-1.20.1-${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Clean legacy Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "beta1-2026-09-06" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RELEASE_JAR" --clobber
            gh release edit "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "Matter Overdrive 1.20.1 ${VERSION}" \
              --notes "Matter Overdrive 1.20.1 test release ${VERSION}. Built from commit $GITHUB_SHA."
          else
            gh release create "$VERSION" "$RELEASE_JAR" \
              --target "$GITHUB_SHA" \
              --title "Matter Overdrive 1.20.1 ${VERSION}" \
              --notes "Matter Overdrive 1.20.1 test release ${VERSION}. Built from commit $GITHUB_SHA."
          fi
