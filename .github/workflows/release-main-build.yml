name: Release Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-main-build.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: matteroverdrive-main-release
  cancel-in-progress: true

env:
  VERSION: '0.4'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize numeric test-version verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text()
          old = "if (mod_version != '0.2.0-alpha') throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          new = "if (!(mod_version ==~ /[0-9]+\\.[0-9]+/)) throw new GradleException(\"Unexpected M2 version: ${mod_version}\")"
          if old not in text:
              raise SystemExit('Expected legacy version verifier was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          cp "$JAR" "MatterOverdrive-1.20.1-${VERSION}.jar"
          echo "RELEASE_JAR=MatterOverdrive-1.20.1-${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Clean legacy Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "beta1-2026-09-06" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Matter Overdrive 1.20.1 release ${VERSION}.

          ## Changed features in 0.4

          ### Android progression and combat

          - Added the full 3 by 3 Android class and subclass structure.
          - Added Strider, Juggernaut and Architect as the three top level Android classes.
          - Added nine subclasses with distinct class ability, tech ability and Ultimate combinations.
          - Added nine unique Ultimates across the subclass matrix.
          - Expanded Aspects and Fragments for subclass build customization.
          - Reworked the old Artifact-facing choice into selectable Passive Protocols while preserving the existing internal save format for compatibility.
          - Strengthened Passive Protocol benefits for combat, defense, mobility, energy recovery, nanite repair and drone support.
          - Added synchronized class ability, tech ability and Ultimate cooldown status to the Android loadout UI.
          - Polished the Android class screen layout and build readability.
          - Expanded the Drone Matrix cap so all nine sequential drone perks through level 10 are reachable.
          - Preserved permanent Android progression separately through the Android Mastery system.

          ### Quests and tracking

          - Added an active quest tracker HUD.
          - Added tracker support for Puny Humans and Cocktail of Ascension progression.
          - Added tracker support for incomplete ContractItem quests.
          - Added quest state synchronization on login, progress updates and regular server ticks.

          ### Weapons and integration

          - Added further native weapon integration work alongside Point Blank compatibility support.
          - Added supporting native weapon profiles, rendering hooks and visual library work.
          - Continued Weapon Station and weapon module integration work already present in the port.

          ### Reactor, energy and drones

          - Preserved the reactor, stabilizer and shared ring power quality of life work from the 0.3 development line.
          - Preserved drone healing, combat support and Android subclass interactions.

          ### Mining and materials

          - Fixed the Matter Overdrive pickaxe mining tag so registered ores are recognized as pickaxe-mineable.
          - Removed an invalid Dilithium Block tag entry that could invalidate correct-tool checks.
          - Restored expected mining-speed behavior for Matter Overdrive ores.
          - Restored correct-tool ore drops for Tritanium and Dilithium ore blocks.

          ### Guides and documentation

          - Updated Android system documentation and handoff references for the completed class, subclass and passive system.
          - Updated player and tester documentation for the consolidated 0.4 feature set.
          - Updated the repository README to reflect the current 0.4 baseline and working systems.

          Built from commit $GITHUB_SHA.
          EOF

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RELEASE_JAR" --clobber
            gh release edit "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "Matter Overdrive 1.20.1 ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$VERSION" "$RELEASE_JAR" \
              --target "$GITHUB_SHA" \
              --title "Matter Overdrive 1.20.1 ${VERSION}" \
              --notes-file release-notes.md
          fi
