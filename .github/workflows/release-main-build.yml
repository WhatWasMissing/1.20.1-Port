name: Release Main Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-main-build.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          cp "$JAR" "MatterOverdrive-1.20.1-Beta1-${GITHUB_SHA::7}.jar"
          echo "RELEASE_JAR=MatterOverdrive-1.20.1-Beta1-${GITHUB_SHA::7}.jar" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: beta1-2026-09-06
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_JAR" --clobber
          else
            gh release create "$TAG" "$RELEASE_JAR" \
              --target "$GITHUB_SHA" \
              --title "Matter Overdrive 1.20.1 Beta 1 - 2026-09-06" \
              --notes "Beta 1 integration build from main. Includes the merged survival progression, structures, AE2 capability hardening, GuideME integration, Android/entity parity, reactor/network work, weapons, world content and current parity fixes. Built from commit $GITHUB_SHA."
          fi
