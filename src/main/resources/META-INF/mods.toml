modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47.4.10,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="BOTH"

# Optional capability-level integration. Matter Overdrive remains standalone.
[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[15.4.10,)"
ordering="AFTER"
side="BOTH"

# GuideME 20.1.x supplies the primary rich player manual when installed.
[[dependencies.${mod_id}]]
modId="guideme"
mandatory=false
versionRange="[20.1.15,21)"
ordering="AFTER"
side="BOTH"

# Optional JEI integration. Standard JSON crafting/cooking recipes are discovered by JEI automatically;
# the plugin below adds Matter Overdrive-specific machine information pages.
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15.49.0.200,16)"
ordering="AFTER"
side="CLIENT"
